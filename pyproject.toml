[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal: rutina diaria, informes de visitas médicas y (pronto) Claude."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
audio = ["faster-whisper>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
gcp = ["google-cloud-firestore>=2.16", "google-cloud-storage>=2.16", "google-cloud-tasks>=2.16", "google-auth>=2.29"]
server = ["jarvis[ai,audio,web,gcp]"]
dev = ["pytest>=8", "httpx>=0.27", "jarvis[ai,web,gcp]"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-server = "jarvis.web.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
