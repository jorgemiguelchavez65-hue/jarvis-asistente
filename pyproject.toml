[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal: rutina diaria, informes de visitas médicas y (pronto) Claude."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
audio = ["faster-whisper>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2"]
render = ["jarvis[ai,web,postgres]"]  # sin Whisper local: el plan gratis no lo soporta
server = ["jarvis[ai,audio,web]"]  # todo en una máquina propia, voz local
dev = ["pytest>=8", "httpx>=0.27", "jarvis[ai,web,postgres]"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-server = "jarvis.web.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
