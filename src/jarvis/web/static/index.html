<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
<title>Jarvis</title>
</head>
<body>
<header><h1>Jarvis</h1><span id="net" hidden>sin conexión</span></header>
<main>
  <section id="login" hidden>
    <h2>Acceso</h2>
    <form id="login-form">
      <input id="token" type="password" placeholder="Contraseña de Jarvis" autocomplete="current-password" required>
      <button class="primary">Entrar</button>
      <p id="login-err" class="err"></p>
    </form>
  </section>

  <section id="home" hidden>
    <div id="orphans"></div>
    <h2>Nueva visita</h2>
    <form id="new-form">
      <input id="n-client" placeholder="Cliente (consultorio, clínica, laboratorio)" required maxlength="200">
      <input id="n-contact" placeholder="Contacto (opcional)" maxlength="200">
      <label class="check"><input id="n-consent" type="checkbox" required>
        La persona visitada sabe y acepta que se grabe o registre esta visita.</label>
      <button class="primary">Empezar visita</button>
      <p id="new-err" class="err"></p>
    </form>
    <h2>Visitas</h2>
    <ul id="visit-list" class="list"></ul>
    <button id="logout" class="link">Cerrar sesión</button>
  </section>

  <section id="visit" hidden>
    <button id="back" class="link">← Visitas</button>
    <h2 id="v-title"></h2>
    <div id="rec-box">
      <div id="timer">00:00</div>
      <div class="row">
        <button id="rec-start" class="primary">● Grabar</button>
        <button id="rec-pause" hidden>⏸ Pausa</button>
        <button id="rec-stop" hidden>■ Detener</button>
      </div>
      <p id="rec-msg" class="muted">Mantén la pantalla encendida mientras grabas.</p>
    </div>
    <div id="chat"></div>
    <form id="ask-form">
      <label class="cam">📷<input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
      <input id="q" placeholder="Pregunta sobre un equipo o reactivo…" autocomplete="off">
      <button class="primary">Enviar</button>
    </form>
    <textarea id="notes" rows="2" placeholder="Notas rápidas (opcional)"></textarea>
    <button id="finish" class="primary wide">Terminar y generar informe</button>
    <p id="v-err" class="err"></p>
  </section>

  <section id="report" hidden>
    <button id="back2" class="link">← Visitas</button>
    <div id="r-status"></div>
    <pre id="r-md"></pre>
    <div class="row" id="r-actions" hidden>
      <button id="r-copy">Copiar</button>
      <button id="r-share">Compartir</button>
      <button id="r-dl">Descargar</button>
    </div>
    <button id="r-retry" class="primary wide" hidden>Reintentar</button>
    <button id="r-del" class="link danger">Borrar esta visita</button>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
