[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal: copiloto de visitas a médicos y laboratorios (grabación, consultas con Claude e informe) y rutina diaria."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Cada extra lista sus dependencias de forma explícita: referenciar "jarvis[...]" desde dentro de
# jarvis rompe a Poetry ("depends on both jarvis[...] (*) and jarvis[...] (<empty>)").
ai = ["anthropic>=0.40"]
audio = ["faster-whisper>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.2"]
# Render (plan gratis): sin Whisper local, que no cabe en esa máquina.
render = [
    "anthropic>=0.40",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27",
    "psycopg[binary]>=3.1", "psycopg_pool>=3.2",
]
# Máquina propia: voz local con Whisper y archivos en disco.
server = [
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "anthropic>=0.40",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27",
    "psycopg[binary]>=3.1", "psycopg_pool>=3.2",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-server = "jarvis.web.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
